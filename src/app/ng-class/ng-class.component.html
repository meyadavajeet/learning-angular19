<div class="row">
  <div class="col-sm-3 p-3" [ngClass]="div1ClassName">
    Div 1
  </div>
  <div class="col-sm-3" [ngClass]="isChecked == true ? 'bg-primary' : 'bg-secondary' ">
    Div 2
  </div>
  <div class="col-sm-3" [ngClass]="div3ClassName">
    Div 3
  </div>
</div>

<div class="row p-4">
  <div [class]="div1ClassName">Div 4 without using the ngClass</div>
</div>

<div class="row">
  <div class="col-sm-3">
    <button (click)="addDynamicClass('bg-success')">Add Success</button>
    <button (click)="addDynamicClass('bg-danger')">Add Danger</button>
  </div>
  <div class="col-sm-3">
    <input type="checkbox" [(ngModel)]="isChecked"> - {{isChecked}}
  </div>
  <div class="col-sm-3">
    <input type="text" [(ngModel)]="div3ClassName">
  </div>
</div>
