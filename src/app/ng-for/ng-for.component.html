<div class="row">
  <div class="col-sm-2">
    <ul>
      <li *ngFor="let city of cityList">{{city}}</li>
    </ul>
  </div>
  <div class="col-sm-5">
    <button class="btn btn-primary" *ngFor="let cityName of cityList">{{cityName}}</button>
  </div>
  <div class="col-sm-5">
    <div *ngFor="let c of cityList">{{c}}</div>
  </div>
</div>

<div class="row">
  <div class="col-sm-2">
    <p>Dynamic dropdown</p>
    <select>
      <option *ngFor="let emp of employeeList;" [value]="emp.employeeId">{{emp.name}} - {{emp.city}}</option>
    </select>
  </div>

  <div class="col-sm-5">
    <table class="table table-bordered">
      <thead>
        <tr>
          <td>Serial No.</td>
          <td>Employee Id</td>
          <td>Name</td>
          <td>City</td>
          <td>Contact No.</td>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of employeeList; let sno = index">
          <td>{{sno+1}}</td>
          <td>{{emp.employeeId}}</td>
          <td>{{emp.name}}</td>
          <td>{{emp.city}}</td>
          <td>{{emp.contactNo}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
